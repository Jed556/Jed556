                                        <div class="description">In a world where eating “Skill Fruits” grants special powers, Light, a boy who seeks to become the world’s greatest adventurer, obtains the &lt;&lt;Fruitmaster&gt;&gt; skill, a bogus skill specializing in fruit cultivation that is completely useless in combat. 
 
Eating a second “Skill Fruit” results in death, so there are no do-overs. Meanwhile, his childhood friend Rena, who promised to become an adventurer with him, achieves S Rank in record time, and the gap between them widens. 
 
Light spends his days farming and training with a sword, but one day, he accidentally eats a second “Skill Fruit.” 
 
“Why am I not dying?!” 
 
Light avoids certain death and learns the incredible true power of the &lt;&lt;Fruitmaster&gt;&gt; skill: he can eat as many “Skill Fruits” as he wants! His overpowered ability allows him to gain an ability every time he eats one, for an unlimited number of times!! The worst skill ever is actually the best skill ever!!! 
 
(Source: Crunchyroll)  
&lt;i&gt;Note: Each episode streamed 1 week early on ABEMA and Crunchyroll. The original TV broadcast started on January 7, 2025.&lt;/i&gt;</div>
