name: Dependabot Auto-Merge
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  Resolve_Conflicts:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Jed556/Jed556' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Merge base and resolve allowed conflicts
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_REF}" "${HEAD_REF}"
          git checkout "${HEAD_REF}"

          set +e
          git merge --no-edit "origin/${BASE_REF}"
          merge_exit=$?
          set -e

          if [ "$merge_exit" -eq 0 ]; then
            echo "Base merged cleanly or branch already up to date."
          else
            mapfile -t conflict_files < <(git diff --name-only --diff-filter=U)

            if [ "${#conflict_files[@]}" -eq 0 ]; then
              echo "Merge failed but no conflicted files were detected."
              exit 1
            fi

            for file in "${conflict_files[@]}"; do
              if [[ ! "$file" =~ ^profile/.*\.(svg|gif)$ ]]; then
                echo "Found disallowed conflicted file: $file"
                echo "Only profile/*.svg and profile/*.gif conflicts are auto-resolved."
                git merge --abort || true
                exit 1
              fi
            done

            # Keep the base branch version for generated profile assets.
            for file in "${conflict_files[@]}"; do
              git checkout --theirs -- "$file"
              git add "$file"
            done

            git commit -m "chore: auto-resolve profile asset conflicts for dependabot PR #${PR_NUMBER}"
          fi

          git push origin "HEAD:${HEAD_REF}"

  Approve:
    runs-on: ubuntu-latest
    needs: [Resolve_Conflicts]
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Jed556/Jed556' && (needs.Resolve_Conflicts.result == 'success' || needs.Resolve_Conflicts.result == 'skipped')
    steps:
      - uses: actions/checkout@v6

      - name: Approve a PR if not already approved
        run: |
          gh pr checkout "$PR_URL" # Sets upstream metadata for gh pr status.
          if [ "$(gh pr status --json reviewDecision -q .currentBranch.reviewDecision)" != "APPROVED" ]; then
            gh pr review --approve "$PR_URL"
          else
            echo "PR already approved, skipping additional approvals."
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  Merge:
    runs-on: ubuntu-latest
    needs: [Approve]
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Jed556/Jed556' && needs.Approve.result == 'success'
    steps:
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for patch updates
        if: ${{ steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest -q '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already enabled."
          else
            gh pr merge --auto --merge "$PR_URL"
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
