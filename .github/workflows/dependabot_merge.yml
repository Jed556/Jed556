name: Dependabot auto-approve
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Jed556/Jed556'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

  resolve_conflicts:
    runs-on: ubuntu-latest
    needs: [approve]
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Jed556/Jed556' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Merge base and resolve allowed conflicts
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_REF}" "${HEAD_REF}"
          git checkout "${HEAD_REF}"

          set +e
          git merge --no-edit "origin/${BASE_REF}"
          merge_exit=$?
          set -e

          if [ "$merge_exit" -eq 0 ]; then
            echo "Base merged cleanly or branch already up to date."
          else
            mapfile -t conflict_files < <(git diff --name-only --diff-filter=U)

            if [ "${#conflict_files[@]}" -eq 0 ]; then
              echo "Merge failed but no conflicted files were detected."
              exit 1
            fi

            for file in "${conflict_files[@]}"; do
              if [[ ! "$file" =~ ^profile/.*\.(svg|gif)$ ]]; then
                echo "Found disallowed conflicted file: $file"
                echo "Only profile/*.svg and profile/*.gif conflicts are auto-resolved."
                git merge --abort || true
                exit 1
              fi
            done

            # Keep the base branch version for generated profile assets.
            for file in "${conflict_files[@]}"; do
              git checkout --theirs -- "$file"
              git add "$file"
            done

            git commit -m "chore: auto-resolve profile asset conflicts for dependabot PR #${PR_NUMBER}"
          fi

          git push origin "HEAD:${HEAD_REF}"
