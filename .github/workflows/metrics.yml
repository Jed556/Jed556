# Your GitHub token
# The following scopes are required:
#  - public_access (default scope)
# The following additional scopes may be required:
#  - read:org      (for organization related metrics)
#  - read:user     (for user related data)
#  - read:packages (for some packages related data)
#  - repo          (optional, if you want to include private repositories)

name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch: # Manual trigger
  push:
    branches: ["Jed"]

jobs:

  User:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: User
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/user.svg
          output_action: none

          # Options
          template: classic
          base: header, activity, community
          config_timezone: Asia/Manila

  Repositories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/repositories.svg
          output_action: none

          # Options
          template: classic
          base: repositories
          config_timezone: Asia/Manila
          repositories_forks: yes

  Languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/languages.svg
          output_action: none

          # Options
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 20
          plugin_languages_other: yes
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

  WakaTime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: WakaTime
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/wakatime.svg
          output_action: none

          # Options
          config_timezone: Asia/Manila
          plugin_wakatime: yes
          plugin_wakatime_days: 365
          plugin_wakatime_limit: 5
          plugin_wakatime_repositories_visibility: all
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_url: https://wakatime.com/@Jed556
          plugin_wakatime_user: current

  AniList:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
      - name: AniList
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/anilist.svg
          output_action: none

          # Options
          config_timezone: Asia/Manila
          plugin_anilist: yes
          plugin_anilist_limit: 2
          plugin_anilist_limit_characters: 22
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites
          plugin_anilist_shuffle: yes
          plugin_anilist_user: Jed556

  Steam:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Steam
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/steam.svg
          output_action: none

          # Options
          config_timezone: Asia/Manila
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_recent_games_limit: 1
          plugin_steam_sections: player, recently-played
          plugin_steam_user: jed_556

  New_Game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: czl9707/gh-space-shooter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'profile/game.gif'
          strategy: 'random'

  Combine:
    runs-on: ubuntu-latest
    needs: [User, Repositories, Languages, WakaTime, AniList, Steam, New_Game]
    steps:
      - uses: actions/checkout@v6
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Merge metrics images
        run: |
          mkdir -p profile
          convert +append \
            \( profile/user.svg profile/repositories.svg profile/languages.svg profile/game.gif -append \) \
            \( profile/wakatime.svg profile/anilist.svg profile/steam.svg -append \) \
            profile/combined.svg
      - name: Commit combined image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/combined.svg
          git add profile/*.svg profile/*.gif
          git commit -m "chore: update metrics"
          git push
      - name: Upload merged image
        uses: actions/upload-artifact@v3
        with:
          name: merged-metrics
          path: profile/combined.svg
