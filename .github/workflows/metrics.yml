# Your GitHub token
# The following scopes are required:
#  - public_access (default scope)
# The following additional scopes may be required:
#  - read:org      (for organization related metrics)
#  - read:user     (for user related data)
#  - read:packages (for some packages related data)
#  - repo          (optional, if you want to include private repositories)

name: Profile
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 */4 * * *"
    - cron: "0 * * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Comma-separated list of targets to execute (user,repositories,gists,languages,wakatime,streak,anilist,steam,new_game,all)"
        required: true
        default: "all"
  push:
    branches: ["Jed"]
    paths:
      - .github/workflows/metrics.yml

concurrency:
  group: profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  Metrics:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'user') || contains(inputs.run, 'repositories') || contains(inputs.run, 'languages') || contains(inputs.run, 'wakatime') || contains(inputs.run, 'streak') || contains(inputs.run, 'anilist') || contains(inputs.run, 'steam') || contains(inputs.run, 'spotify') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: User
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'user')) && (github.event_name != 'schedule' || github.event.schedule == '0 */4 * * *') }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/user.svg
          plugins_errors_fatal: yes

          # OPTIONS
          template: classic
          base: header, activity, community
          config_timezone: Asia/Manila

      - name: Repositories
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'repositories')) && (github.event_name != 'schedule' || github.event.schedule == '0 */4 * * *') }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/repositories.svg
          plugins_errors_fatal: yes

          # OPTIONS
          template: classic
          base: repositories
          config_timezone: Asia/Manila
          repositories_forks: yes

      - name: Gists
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'gists')) && (github.event_name != 'schedule' || github.event.schedule == '0 */4 * * *') }}
        uses: lowlighter/metrics@latest
        with:
          filename: profile/gists.svg
          token: ${{ secrets.METRICS_TOKEN }}
          plugins_errors_fatal: yes
          base: ""
          plugin_gists: yes

      - name: Languages
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'languages')) && (github.event_name != 'schedule' || github.event.schedule == '0 */4 * * *') }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/languages.svg
          plugins_errors_fatal: yes

          # OPTIONS
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 20
          plugin_languages_other: no
          # Indepth Analysis Options
          plugin_languages_analysis_timeout: 60 #default: 15
          plugin_languages_analysis_timeout_repositories: 0 #default: 7.5
          # Most Used Options (Indepth)
          plugin_languages_categories: markup, programming
          # Recently Used Options (Indepth)
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_threshold: 0%

      - name: WakaTime
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'wakatime')) && (github.event_name != 'schedule' || github.event.schedule == '0 */4 * * *') }}
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/wakatime.svg
          plugins_errors_fatal: yes

          # OPTIONS
          config_timezone: Asia/Manila
          plugin_wakatime: yes
          plugin_wakatime_days: 365
          plugin_wakatime_limit: 5
          plugin_wakatime_repositories_visibility: all
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_user: current

      - name: Streak
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.run == 'all' || contains(inputs.run, 'streak'))) || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STREAK_OPTIONS: user=Jed556&currStreakLabel=56d364&ring=56d364&fire=56d364&hide_border=true&background=77777700&dates=777777&border=777777&sideLabels=777777&currStreakNum=959da5&sideNums=959da5&stroke=777777&mode=daily
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y php-cli php-curl php-intl unzip

          if ! command -v composer >/dev/null 2>&1; then
            php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
            sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer
            rm composer-setup.php
          fi

          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

          action_dir="$(mktemp -d)"
          git clone --depth=1 https://github.com/DenverCoder1/github-readme-streak-stats.git "${action_dir}"
          composer --working-dir="${action_dir}" install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          INPUT_OPTIONS="${STREAK_OPTIONS}" \
          INPUT_PATH="profile/streak.svg" \
          TOKEN="${GH_TOKEN}" \
            php "${action_dir}/bin/generate-card.php"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push

      - name: AniList
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'anilist')) && (github.event_name != 'schedule' || github.event.schedule == '0 * * * *') }}
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/anilist.svg
          plugins_errors_fatal: yes

          # OPTIONS
          config_timezone: Asia/Manila
          plugin_anilist: yes
          plugin_anilist_limit: 1
          plugin_anilist_limit_characters: 11
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, watching, reading, characters
          plugin_anilist_shuffle: yes
          plugin_anilist_user: Jed556

          # STYLE
          extras_css: |
            div.anilist {
              margin-left: 16px !important;
            }
            div.anilist h2 {
              margin-bottom: 8px !important;
            }

      - name: Steam
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'steam')) && (github.event_name != 'schedule' || github.event.schedule == '0 * * * *') }}
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/steam.svg
          plugins_errors_fatal: yes

          # OPTIONS
          config_timezone: Asia/Manila
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_games_limit: 1
          plugin_steam_recent_games_limit: 1
          plugin_steam_achievements_limit: 1
          plugin_steam_playtime_threshold: 0
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_user: ${{ secrets.STEAM_USER_ID }}

          # STYLE
          extras_css: |
            div.games {
              margin-left: 16px !important;
            }
            div.games h2 {
              margin-bottom: 8px !important;
            }

      - name: Spotify
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'spotify')) && (github.event_name != 'schedule' || github.event.schedule == '*/10 * * * *') }}
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/spotify.svg
          plugins_errors_fatal: yes

          # OPTIONS
          config_timezone: Asia/Manila
          plugin_music: yes
          plugin_music_token: ${{ secrets.SPOTIFY_CLIENT_ID }}, ${{ secrets.SPOTIFY_CLIENT_SECRET }}, ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          plugin_music_limit: 3
          plugin_music_mode: recent
          plugin_music_played_at: yes
          plugin_music_provider: spotify
          plugin_music_time_range: short
          plugin_music_top_type: tracks
          plugin_music_user: Jed

  New_Game:
    needs: [Metrics]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'new_game')) && (github.event_name != 'schedule' || github.event.schedule == '0 * * * *') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Generate Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'profile/game.gif'
          strategy: 'random'

  Compact_History:
    needs: [Metrics, New_Game]
    if: ${{ always() && !cancelled() && (needs.Metrics.result == 'success' || needs.New_Game.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Compact generated assets history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"
          shopt -s nullglob
          FILES=(profile/*)

          TMP_DIR="$(mktemp -d)"
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              mkdir -p "$TMP_DIR/$(dirname "$file")"
              cp "$file" "$TMP_DIR/$file"
            fi
          done

          INDEX_FILTER_CMD='git rm -r --cached --ignore-unmatch -- profile/*'

          git filter-branch -f --prune-empty --index-filter "$INDEX_FILTER_CMD" -- "$BRANCH"

          for file in "${FILES[@]}"; do
            if [ -f "$TMP_DIR/$file" ]; then
              mkdir -p "$(dirname "$file")"
              cp "$TMP_DIR/$file" "$file"
            fi
          done

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Compact generated profile asset history [skip ci]"
          fi

          git push --force-with-lease origin "$BRANCH"
