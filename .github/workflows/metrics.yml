# Your GitHub token
# The following scopes are required:
#  - public_access (default scope)
# The following additional scopes may be required:
#  - read:org      (for organization related metrics)
#  - read:user     (for user related data)
#  - read:packages (for some packages related data)
#  - repo          (optional, if you want to include private repositories)

name: Profile
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Comma-separated list of targets to execute (user,repositories,languages,wakatime,anilist,steam,new_game,all)"
        required: true
        default: "all"
  push:
    branches: ["Jed"]
    paths-ignore:
      - profile/user.svg
      - profile/repositories.svg
      - profile/languages.svg
      - profile/wakatime.svg
      - profile/anilist.svg
      - profile/steam.svg
      - profile/spotify.svg
      - profile/game.gif

concurrency:
  group: profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  Metrics:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'user') || contains(inputs.run, 'repositories') || contains(inputs.run, 'languages') || contains(inputs.run, 'wakatime') || contains(inputs.run, 'anilist') || contains(inputs.run, 'steam') || contains(inputs.run, 'spotify') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: User
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'user') }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/user.svg

          # Options
          template: classic
          base: header, activity, community
          config_timezone: Asia/Manila

      - name: Repositories
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'repositories') }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/repositories.svg

          # Options
          template: classic
          base: repositories
          config_timezone: Asia/Manila
          repositories_forks: yes

      - name: Languages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'languages') }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/languages.svg

          # Options
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 20
          plugin_languages_other: yes
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      - name: WakaTime
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'wakatime') }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/wakatime.svg

          # Options
          config_timezone: Asia/Manila
          plugin_wakatime: yes
          plugin_wakatime_days: 365
          plugin_wakatime_limit: 5
          plugin_wakatime_repositories_visibility: all
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_user: current

      - name: AniList
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'anilist') }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/anilist.svg

          # Options
          config_timezone: Asia/Manila
          plugin_anilist: yes
          plugin_anilist_limit: 1
          plugin_anilist_limit_characters: 11
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, watching, reading, characters
          plugin_anilist_shuffle: yes
          plugin_anilist_user: Jed556

      - name: Steam
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'steam') }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/steam.svg

          # Options
          config_timezone: Asia/Manila
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_games_limit: 1
          plugin_steam_recent_games_limit: 1
          plugin_steam_achievements_limit: 1
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_user: '76561198429674322'

      - name: Spotify
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'spotify') }}
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile/spotify.svg

          # Options
          config_timezone: Asia/Manila
          plugin_music: yes
          plugin_music_token: ${{ secrets.SPOTIFY_CLIENT_ID }}, ${{ secrets.SPOTIFY_CLIENT_SECRET }}, ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          plugin_music_limit: 3
          plugin_music_mode: recent
          plugin_music_played_at: yes
          plugin_music_provider: spotify
          plugin_music_time_range: short
          plugin_music_top_type: tracks
          plugin_music_user: Jed

  New_Game:
    needs: [Metrics]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.run == 'all' || contains(inputs.run, 'new_game')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Generate Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'profile/game.gif'
          strategy: 'random'

  Compact_History:
    needs: [Metrics, New_Game]
    if: ${{ always() && !cancelled() && (needs.Metrics.result == 'success' || needs.New_Game.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Compact generated assets history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"
          FILES=(
            profile/user.svg
            profile/repositories.svg
            profile/languages.svg
            profile/wakatime.svg
            profile/anilist.svg
            profile/steam.svg
            profile/spotify.svg
            profile/game.gif
          )

          TMP_DIR="$(mktemp -d)"
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              mkdir -p "$TMP_DIR/$(dirname "$file")"
              cp "$file" "$TMP_DIR/$file"
            fi
          done

          git filter-branch -f --prune-empty --index-filter "git rm -r --cached --ignore-unmatch -- profile/user.svg profile/repositories.svg profile/languages.svg profile/wakatime.svg profile/anilist.svg profile/steam.svg profile/spotify.svg profile/game.gif" -- "$BRANCH"

          for file in "${FILES[@]}"; do
            if [ -f "$TMP_DIR/$file" ]; then
              mkdir -p "$(dirname "$file")"
              cp "$TMP_DIR/$file" "$file"
            fi
          done

          git add profile/user.svg profile/repositories.svg profile/languages.svg profile/wakatime.svg profile/anilist.svg profile/steam.svg profile/spotify.svg profile/game.gif || true

          if ! git diff --cached --quiet; then
            git commit -m "Compact generated profile asset history [skip ci]"
          fi

          git push --force-with-lease origin "$BRANCH"
